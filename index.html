<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--panel2:#262626;--line:#424242;--text:#ececec;--muted:#a1a1a1;--green:#10a37f;--hover:#2a2a2a;--blue:#6aa9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer;background:transparent}button:hover{background:var(--hover)}a{color:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:260px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:12px;transition:.2s;z-index:5}.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#18c69a,#087c65);display:grid;place-items:center;color:white;font-size:19px;font-weight:900}.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#bbb;font-size:18px}.navbtn{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;text-align:right;width:100%;font-size:13px;margin:2px 0}.navbtn .ico{font-size:17px;width:20px;text-align:center}.navbtn.active{background:#2a2a2a}.side-label{font-size:11px;color:#858585;padding:18px 10px 7px}.history{overflow:auto;flex:1}.history-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:9px;font-size:12px;color:#d2d2d2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item:hover,.history-item.active{background:#292929}.profile{border-top:1px solid #303030;padding-top:12px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#6654a3;display:grid;place-items:center;font-size:14px;font-weight:800}.profile-name{font-size:12px;font-weight:700}.profile-plan{font-size:10px;color:var(--muted)}.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}.top-left,.top-right{display:flex;align-items:center;gap:8px}.model-select{font-size:16px;font-weight:800;padding:8px 11px;border-radius:10px}.model-select span{color:#aaa;font-size:11px;margin-right:6px}.upgrade{border:1px solid #555;border-radius:20px;padding:8px 13px;font-size:11px}.content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center}.welcome{width:min(790px,calc(100% - 32px));margin:auto auto 0;padding:20px 0 22px;text-align:center}.welcome h1{font-size:29px;font-weight:600;margin:0 0 25px;letter-spacing:-.5px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 auto 18px;max-width:620px}.quick{border:1px solid #424242;border-radius:14px;text-align:right;padding:13px 15px;min-height:72px}.quick b{font-size:13px;display:block}.quick small{font-size:11px;color:var(--muted)}.composer-wrap{width:min(790px,calc(100% - 32px));padding:10px 0 24px;flex:none}.composer{background:#303030;border:1px solid #484848;border-radius:25px;padding:12px 14px 9px;box-shadow:0 8px 35px #0002}.composer textarea{width:100%;resize:none;max-height:180px;min-height:36px;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;padding:7px 5px}.composer textarea::placeholder{color:#aaa}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:8px}.tool-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.tool-pill{font-size:11px;color:#ccc;padding:7px 10px;border-radius:18px;display:flex;gap:6px;align-items:center}.tool-pill.on{background:#164638;color:#8ce5c4}.send{width:34px;height:34px;border-radius:50%;background:#eee;color:#222;font-size:18px;font-weight:900}.send:disabled{opacity:.4;cursor:default}.footnote{text-align:center;color:#858585;font-size:10px;margin-top:9px}.messages{width:min(790px,calc(100% - 32px));margin:26px auto 8px;display:flex;flex-direction:column;gap:24px}.msg{display:flex;gap:12px;align-items:flex-start}.msg.user{justify-content:flex-start}.msg-avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#3d3d3d;font-size:13px}.msg.assistant .msg-avatar{background:linear-gradient(145deg,#18c69a,#087c65)}.msg-body{min-width:0;max-width:calc(100% - 42px);font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .msg-body{background:#303030;border-radius:18px;padding:10px 15px}.msg-actions{display:flex;gap:6px;margin-top:7px}.msg-actions button{color:#999;padding:4px 7px;border-radius:7px;font-size:11px}.source{border:1px solid #4b4b4b;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:11px;display:block;text-decoration:none;background:#292929}.source small{display:block;color:#aaa}.typing{color:#aaa;font-size:12px}.page{width:min(900px,calc(100% - 36px));margin:38px auto;}.page h1{font-size:25px;margin:0 0 8px}.page-sub{color:#aaa;font-size:13px;margin-bottom:25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid #414141;background:#292929;border-radius:15px;padding:16px;min-height:120px}.card .card-icon{font-size:23px}.card h3{font-size:14px;margin:9px 0 4px}.card p{font-size:11px;color:#aaa;line-height:1.8;margin:0}.card button{margin-top:12px;border:1px solid #555;border-radius:9px;padding:7px 11px;font-size:11px}.modal-bg{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:#242424;border:1px solid #555;border-radius:18px;padding:20px;max-height:85vh;overflow:auto}.modal h2{font-size:17px;margin:0 0 12px}.modal p{font-size:12px;color:#aaa;line-height:1.9}.modal input{width:100%;background:#333;border:1px solid #555;border-radius:9px;padding:10px;color:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.modal-actions button{padding:8px 14px;border-radius:9px;background:#3a3a3a;font-size:12px}.modal-actions .primary{background:var(--green);color:white}.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.image-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;border:1px solid #555;padding:9px 15px;border-radius:12px;font-size:11px;z-index:30}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);width:275px;box-shadow:10px 0 50px #0008}.sidebar.open{transform:translateX(0)}.topbar{padding:0 10px}.welcome h1{font-size:23px}.quick-grid{grid-template-columns:1fr}.quick{min-height:58px}.composer-wrap{width:calc(100% - 20px);padding-bottom:14px}.messages{width:calc(100% - 24px)}.page{margin:25px auto}.upgrade{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-top"><div class="brand"><div class="logo">N</div><span>NITRO AI</span></div><button class="iconbtn" id="collapseBtn" title="بستن منو">☰</button></div>
 <button class="navbtn active" data-page="chat" id="newChat"><span class="ico">＋</span> چت جدید</button>
 <button class="navbtn" data-page="search"><span class="ico">⌕</span> جست‌وجو</button>
 <button class="navbtn" data-page="explore"><span class="ico">▦</span> اکسپلور</button>
 <button class="navbtn" data-page="library"><span class="ico">▧</span> کتابخانه تصاویر</button>
 <button class="navbtn" data-page="projects"><span class="ico">▣</span> پروژه‌ها</button>
 <div class="side-label">اخیر</div><div class="history" id="history"></div>
 <div class="profile"><div class="avatar">N</div><div style="flex:1"><div class="profile-name">کاربر نیترو</div><div class="profile-plan" id="planLabel">پلن Free</div></div><button class="iconbtn" id="profileBtn">•••</button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="iconbtn" id="menuBtn">☰</button><button class="model-select" id="modelBtn">NITRO 1 <span>⌄</span></button></div><div class="top-right"><button class="upgrade" id="planBtn">ارتقا به Plus ↗</button><button class="iconbtn" id="settingsBtn" title="تنظیمات">⚙</button></div></header>
 <section class="content" id="content">
  <div class="welcome" id="welcome"><h1>امروز چطور می‌تونم کمکت کنم؟</h1><div class="quick-grid">
   <button class="quick" data-prompt="برای پروژه‌ام یک برنامه حرفه‌ای طراحی کن"><b>✦ ایده‌پردازی و برنامه‌ریزی</b><small>ایده‌ها را به برنامه تبدیل کن</small></button>
   <button class="quick" data-prompt="این کد را بررسی و اشکال‌زدایی کن"><b>⌘ برنامه‌نویسی</b><small>کدنویسی و رفع اشکال</small></button>
   <button class="quick" data-prompt="یک موضوع را با جست‌وجوی وب بررسی کن"><b>⌕ تحقیق در وب</b><small>اطلاعات تازه همراه منابع</small></button>
   <button class="quick" data-prompt="یک داستان جذاب و خلاقانه بنویس"><b>✎ نوشتن و خلاقیت</b><small>متن، داستان و سناریو</small></button>
  </div></div>
  <div class="messages hidden" id="messages"></div>
  <div class="page hidden" id="page"></div>
 </section>
 <footer class="composer-wrap" id="composerWrap">
  <div class="composer"><textarea id="prompt" rows="1" placeholder="پیامی برای NITRO AI بنویس..."></textarea>
   <div class="composer-tools"><div class="tool-group">
    <button class="iconbtn" id="attachBtn" title="افزودن فایل">＋</button><input type="file" id="fileInput" hidden multiple>
    <button class="tool-pill" id="searchToggle">⌕ جست‌وجوی وب</button>
    <button class="tool-pill" id="thinkToggle">◉ فکرکردن</button>
    <button class="tool-pill" id="imageBtn">▧ تصویر</button>
   </div><button class="send" id="sendBtn" disabled>↑</button></div>
  </div><div class="footnote">NITRO AI ممکن است اشتباه کند. اطلاعات مهم را بررسی کن.</div>
 </footer>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);
const state={chats:[],active:null,search:false,think:false,model:'NITRO 1',plan:'Free',page:'chat',images:[],files:[]};
const saved=localStorage.getItem('nitro-chat-v1');if(saved){try{Object.assign(state,JSON.parse(saved))}catch{}}
function persist(){localStorage.setItem('nitro-chat-v1',JSON.stringify({...state,files:[]}));}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function current(){return state.chats.find(c=>c.id===state.active)}
function newChat(){const c={id:Date.now().toString(),title:'چت جدید',messages:[],time:Date.now()};state.chats.unshift(c);state.active=c.id;state.page='chat';render();persist();$('prompt').focus()}
function renderHistory(){const el=$('history');el.innerHTML='';state.chats.slice(0,40).forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===state.active?' active':'');b.textContent=c.title;b.onclick=()=>{state.active=c.id;state.page='chat';render()};el.appendChild(b)})}
function render(){renderHistory();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('modelBtn').innerHTML=state.model+' <span>⌄</span>';$('planLabel').textContent='پلن '+state.plan;
 const chat=state.page==='chat';$('composerWrap').classList.toggle('hidden',!chat);$('welcome').classList.toggle('hidden',!chat||!!(current()?.messages.length));$('messages').classList.toggle('hidden',!chat||!(current()?.messages.length));$('page').classList.toggle('hidden',chat);
 if(chat){renderMessages()}else renderPage();persist()}
function renderMessages(){const el=$('messages');el.innerHTML='';const c=current();if(!c||!c.messages.length)return;c.messages.forEach((m,i)=>{const row=document.createElement('div');row.className='msg '+(m.role==='user'?'user':'assistant');const av=document.createElement('div');av.className='msg-avatar';av.textContent=m.role==='user'?'ش':'N';const body=document.createElement('div');body.className='msg-body';body.textContent=m.text;row.append(av,body);if(m.sources?.length){m.sources.forEach(s=>{const a=document.createElement('a');a.className='source';a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=s.title;const sm=document.createElement('small');sm.textContent=s.snippet||s.url;a.append(sm);body.append(a)})}if(m.role==='assistant'){const actions=document.createElement('div');actions.className='msg-actions';[['کپی','⧉'],['جست‌وجوی بیشتر','⌕']].forEach(([label,icon])=>{const b=document.createElement('button');b.textContent=icon+' '+label;b.onclick=()=>label==='کپی'?navigator.clipboard?.writeText(m.text).then(()=>toast('کپی شد')):doSearch(c.messages[i-1]?.text||m.text);actions.append(b)});body.append(actions)}el.append(row)});$('content').scrollTop=$('content').scrollHeight}
function setPage(p){state.page=p;render()}
function renderPage(){const p=$('page');if(state.page==='explore'){p.innerHTML='<h1>اکسپلور NITRO AI</h1><div class="page-sub">ابزارها و قابلیت‌هایی که می‌توانی به گردش کارت اضافه کنی.</div><div class="cards">'+[['⌕','جست‌وجوی وب','جست‌وجو در منابع عمومی و دریافت پیوندها','جست‌وجو'],['▧','Image Library','مدیریت تصاویر ذخیره‌شده در همین مرورگر','بازکردن'],['⌘','برنامه‌نویسی','کمک برای ساخت، بررسی و اصلاح کد','شروع گفتگو'],['◉','فکرکردن','پاسخ‌گویی با مراحل تحلیل بیشتر','فعال‌سازی'],['✦','ایده‌پرداز','ایده‌سازی و برنامه‌ریزی پروژه‌ها','شروع گفتگو'],['⚙','پلاگین‌ها','اتصال ابزارهای جانبی در نسخه‌های آینده','مشاهده']].map((x,i)=>'<div class="card"><div class="card-icon">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p><button data-explore="'+i+'">'+x[3]+'</button></div>').join('')+'</div>';p.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>{const i=+b.dataset.explore;if(i===0){state.search=true;setPage('chat');toast('جست‌وجوی وب روشن شد')}else if(i===1)setPage('library');else if(i===3){state.think=true;setPage('chat');toast('حالت فکرکردن روشن شد')}else if(i===5)openModal('پلاگین‌ها','در این نسخه فهرست نمایشی است. اتصال واقعی هر سرویس به مجوز و API همان سرویس نیاز دارد.')} );}
 else if(state.page==='library'){p.innerHTML='<h1>کتابخانه تصاویر</h1><div class="page-sub">تصاویر انتخابی تو در همین مرورگر نگهداری می‌شوند.</div><button class="upgrade" id="addImages">＋ افزودن تصاویر</button><input id="libFiles" type="file" accept="image/*" multiple hidden><div class="image-grid" id="imageGrid" style="margin-top:18px"></div>';const input=$('libFiles');$('addImages').onclick=()=>input.click();input.onchange=()=>{[...input.files].forEach(file=>{const reader=new FileReader();reader.onload=()=>{state.images.push(reader.result);persist();renderPage()};reader.readAsDataURL(file)})};$('imageGrid').innerHTML=state.images.map((src,i)=>'<img src="'+src+'" alt="تصویر '+(i+1)+'">').join('')||'<p class="page-sub">هنوز تصویری اضافه نکرده‌ای.</p>'}
 else if(state.page==='projects'){p.innerHTML='<h1>پروژه‌ها</h1><div class="page-sub">گفتگوها و کارهای مرتبط را در یک فضای کاری نگه دار.</div><div class="cards"><div class="card"><div class="card-icon">▣</div><h3>پروژه جدید</h3><p>یک فضای تازه برای گفتگوها و فایل‌های مرتبط بساز.</p><button id="createProject">ساخت پروژه</button></div><div class="card"><div class="card-icon">📁</div><h3>پروژه‌های من</h3><p>پروژه‌ها در این نسخه به‌صورت محلی ذخیره می‌شوند.</p></div></div>'; $('createProject').onclick=()=>openModal('ساخت پروژه','<input id="projectName" placeholder="نام پروژه"><div class="modal-actions"><button class="primary" id="saveProject">ایجاد</button></div>',()=>{const n=$('projectName').value.trim();if(n)toast('پروژه «'+n+'» ساخته شد')})}
 else if(state.page==='search'){p.innerHTML='<h1>جست‌وجوی وب</h1><div class="page-sub">یک عبارت جست‌وجو کن تا نتایج و پیوندهای مرتبط را ببینی.</div><div class="composer"><input id="pageSearch" placeholder="چه چیزی را جست‌وجو کنیم؟" style="width:80%;background:transparent;border:0;color:white;padding:10px"><button class="send" id="pageSearchBtn">⌕</button></div><div id="searchResults"></div>';const go=()=>doSearch($('pageSearch').value);$('pageSearchBtn').onclick=go;$('pageSearch').onkeydown=e=>{if(e.key==='Enter')go()}}
}
function openModal(title,body,after){$('modalRoot').innerHTML='<div class="modal-bg"><div class="modal"><h2>'+title+'</h2>'+body+'<div class="modal-actions"><button id="modalClose">بستن</button></div></div></div>';$('modalClose').onclick=()=>$('modalRoot').innerHTML='';if(after){const old=$('modalRoot').querySelector('.modal-actions');const buttons=old.querySelectorAll('button');buttons[0].onclick=()=>{$('modalRoot').innerHTML=''};const b=$('modalRoot').querySelector('#saveProject');if(b)b.onclick=()=>{after();$('modalRoot').innerHTML=''}}}
async function doSearch(q){q=(q||'').trim();if(!q){toast('عبارت جست‌وجو را بنویس');return}state.page='chat';render();if(!state.active)newChat();const c=current();c.messages.push({role:'user',text:'جست‌وجو کن: '+q});renderMessages();const placeholder={role:'assistant',text:'در حال جست‌وجو در منابع عمومی...'};c.messages.push(placeholder);renderMessages();try{const url='https://en.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=5&namespace=0&format=json&origin=*';const data=await fetch(url).then(r=>r.json());const sources=(data[1]||[]).map((title,i)=>({title,url:data[3][i],snippet:'نتیجه از ویکی‌پدیا'}));const summary=sources.length?'نتایج جست‌وجو برای «'+q+'» را پیدا کردم. این پیوندها را بررسی کن؛ برای اطلاعات حساس یا تخصصی، منابع اصلی را هم ببین.':'نتیجه مستقیمی پیدا نشد. عبارت دیگری امتحان کن.';c.messages[c.messages.length-1]={role:'assistant',text:summary,sources};renderMessages();persist()}catch(e){c.messages[c.messages.length-1]={role:'assistant',text:'جست‌وجو انجام نشد. اتصال اینترنت را بررسی کن یا دوباره تلاش کن.'};renderMessages()} }
function answerLocal(q){const t=q.toLowerCase();if(/سلام|درود|hello/.test(t))return'سلام! من نیترو AI هستم. چه کاری از دستم برمیاد؟';if(/scp|اس سی پی/.test(t))return'پروژه SCP درباره سازمانی خیالی است که پدیده‌ها و موجودات غیرعادی را مهار، نگهداری و محافظت می‌کند. اگر بخواهی می‌توانم درباره تاریخچه، کلاس‌های شیء یا یگان‌های واکنش سریع توضیح بدهم. برای اطلاعات دقیق‌تر می‌توانی جست‌وجوی وب را روشن کنی.';if(/پایتون|python/.test(t))return'پایتون یک زبان برنامه‌نویسی سطح‌بالا و چندمنظوره است. برای شروع، متغیرها، شرط‌ها، حلقه‌ها و تابع‌ها را یاد بگیر. اگر موضوع مشخصی داری، بگو تا با مثال توضیح بدهم.';if(/چی هستی|نامت/.test(t))return'من NITRO AI هستم؛ یک نمونه دستیار گفتگو با رابط فارسی. در این نسخه پاسخ‌های پایه و جست‌وجوی وب عمومی فعال‌اند.';return'در نسخه فعلی، موتور پاسخ‌گویی مستقل هنوز به یک API مدل زبانی متصل نشده است. می‌توانم به پرسش‌های پایه پاسخ بدهم یا با روشن‌کردن «جست‌وجوی وب» منابع عمومی مرتبط را پیدا کنم. برای پاسخ هوشمند کامل باید یک مدل زبانی به سرور امن متصل کنیم.'}
async function send(){const input=$('prompt'),q=input.value.trim();if(!q)return;if(!state.active)newChat();const c=current();c.title=c.messages.length?c.title:q.slice(0,32);c.messages.push({role:'user',text:q});input.value='';input.style.height='36px';$('sendBtn').disabled=true;render();if(state.search){await doSearch(q);state.search=false;$('searchToggle').classList.remove('on');$('searchToggle').textContent='⌕ جست‌وجوی وب';$('sendBtn').disabled=false;return}c.messages.push({role:'assistant',text:answerLocal(q)+(state.think?'\n\nحالت فکرکردن فعال است؛ این پاسخ در نسخه نمایشی با تحلیل اضافه تولید نشده است.':'')});render();$('sendBtn').disabled=false;persist()}
$('sendBtn').onclick=send;$('prompt').oninput=e=>{$('sendBtn').disabled=!e.target.value.trim();e.target.style.height='36px';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('newChat').onclick=newChat;document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>{if(b.id==='newChat')return;setPage(b.dataset.page)});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;$('sendBtn').disabled=false;$('prompt').focus()});
$('searchToggle').onclick=()=>{state.search=!state.search;$('searchToggle').classList.toggle('on',state.search);toast(state.search?'جست‌وجوی وب روشن شد':'جست‌وجوی وب خاموش شد')};$('thinkToggle').onclick=()=>{state.think=!state.think;$('thinkToggle').classList.toggle('on',state.think);toast(state.think?'حالت فکرکردن روشن شد':'حالت فکرکردن خاموش شد')};
$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{state.files=[...e.target.files].map(f=>f.name);toast('فایل انتخاب شد: '+state.files.join('، '))};$('imageBtn').onclick=()=>openModal('ساخت تصویر','<p>بخش تصویر در این نسخه نمایشی است. برای تولید تصویر واقعی باید سرویس تولید تصویر به پروژه متصل شود.</p>');
$('modelBtn').onclick=()=>openModal('انتخاب مدل','<p>مدل فعلی: NITRO 1</p><button id="modelNitro" class="upgrade">NITRO 1 · عمومی</button> <button id="modelFast" class="upgrade">NITRO Fast · سریع</button>',()=>{});$('planBtn').onclick=()=>openModal('پلن‌های NITRO AI','<div class="cards"><div class="card"><h3>Free</h3><p>دسترسی پایه به گفتگو و جست‌وجو</p><button id="chooseFree">انتخاب Free</button></div><div class="card"><h3>Plus</h3><p>طرح نمایشی رابط کاربری؛ پرداخت و اشتراک واقعی فعال نیست.</p><button id="choosePlus">نمایش Plus</button></div></div>');$('settingsBtn').onclick=()=>openModal('تنظیمات','<p>زبان: فارسی<br>ذخیره گفتگوها: حافظه محلی مرورگر<br>نسخه: NITRO AI UI 1.0</p>');$('profileBtn').onclick=()=>$('planBtn').click();$('collapseBtn').onclick=()=>$('sidebar').classList.remove('open');$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('modelBtn').addEventListener('click',()=>{setTimeout(()=>{const a=$('modelNitro'),b=$('modelFast');if(a)a.onclick=()=>{state.model='NITRO 1';$('modelBtn').innerHTML=state.model+' <span>⌄</span>';$('modalRoot').innerHTML=''};if(b)b.onclick=()=>{state.model='NITRO Fast';$('modelBtn').innerHTML=state.model+' <span>⌄</span>';$('modalRoot').innerHTML=''}} ,0)});
$('planBtn').addEventListener('click',()=>{setTimeout(()=>{const a=$('chooseFree'),b=$('choosePlus');if(a)a.onclick=()=>{state.plan='Free';$('planLabel').textContent='پلن Free';$('modalRoot').innerHTML='';persist()};if(b)b.onclick=()=>{state.plan='Plus (نمایشی)';$('planLabel').textContent='پلن Plus (نمایشی)';$('modalRoot').innerHTML='';toast('این فقط نمایش ظاهری پلن است')}} ,0)});
function openSettingsProfile(){}
if(!state.chats.length)newChat();else{state.active=state.active||state.chats[0].id;render()}
</script>
