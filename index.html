<!DOCTYPE html> 
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONINA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#05060a;--ink:#f4efe6;--gold:#e8b85a;--green:#2fe08f;--red:#8a2a35;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#1a1426,#05060a 70%);z-index:10;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
#start h1{font-weight:900;font-size:clamp(1.6rem,6vw,3rem);margin:0;text-align:center;letter-spacing:0}
#go{font:inherit;font-weight:700;font-size:1.3rem;color:var(--ink);background:transparent;border:2px solid var(--gold);padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 0 24px #e8b85a66,inset 0 0 18px #e8b85a33;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 52px #e8b85acc,inset 0 0 26px #e8b85a66}}
#sub{position:fixed;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom));text-align:center;padding:0 6vw;font-weight:700;font-size:clamp(1.05rem,3.6vw,2rem);line-height:1.9;text-shadow:0 2px 14px #000,0 0 30px #000;pointer-events:none;z-index:5;transition:opacity .5s}
#card{position:fixed;left:50%;top:50%;width:min(92vw,520px);transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.2,1);padding:34px 26px 30px;border-radius:28px;background:linear-gradient(160deg,#ffffff1f,#ffffff08);border:1px solid #ffffff2e;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px #000a;text-align:center;z-index:6}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#card p{font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:2;margin:0 0 30px;font-weight:700}
#btns{display:flex;gap:18px;justify-content:center;align-items:center;min-height:90px}
.b{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:16px;padding:13px 24px;cursor:pointer;color:#fff;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .6s,left .22s,top .22s}
#yes{background:linear-gradient(135deg,#17b974,var(--green));color:#042;box-shadow:0 0 28px #2fe08f88}
#no{background:var(--red);opacity:.85}
#no.gone{opacity:0;transform:scale(.1);pointer-events:none}
#cat{position:fixed;left:50%;bottom:0;width:min(60vw,260px);transform:translate(-50%,120%);transition:transform .7s cubic-bezier(.3,1.5,.5,1);z-index:8;pointer-events:none}
#cat.up{transform:translate(-50%,6%)}
#bub{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#222;font-weight:900;padding:10px 18px;border-radius:20px;font-size:1.15rem}
#bub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:#fff}
.b{min-height:48px}
@media(max-height:520px){#card{padding:18px 18px 16px}#card p{margin-bottom:14px;line-height:1.7}#btns{min-height:70px}#sub{bottom:4%}#cat{width:min(30vw,170px)}}
@media(prefers-reduced-motion:reduce){#go{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="cf" style="z-index:7;pointer-events:none"></canvas>
<div id="sub"></div>
<div id="card"><p>ببخشید یکمی دیر سین می‌زنم، ولی باید باور کنی که از عمد نیست 😉</p>
<div id="btns"><button class="b" id="yes">بخشیدمت</button><button class="b" id="no">گور خودتو کندی</button></div></div>
<div id="cat"><div id="bub">ممنون! 🐾❤️</div>
<svg viewBox="0 0 200 190"><ellipse cx="100" cy="160" rx="62" ry="50" fill="#f2a24a"/><path d="M48 70 L52 18 L88 46Z M152 70 L148 18 L112 46Z" fill="#f2a24a"/><path d="M56 60 L58 34 L76 48Z M144 60 L142 34 L124 48Z" fill="#ffb7b7"/><circle cx="100" cy="88" r="52" fill="#f2a24a"/><circle cx="80" cy="82" r="7" fill="#222"/><circle cx="120" cy="82" r="7" fill="#222"/><circle cx="82" cy="80" r="2.4" fill="#fff"/><circle cx="122" cy="80" r="2.4" fill="#fff"/><path d="M94 98 h12 l-6 7z" fill="#e9728a"/><path d="M100 105 q-8 10 -16 4 M100 105 q8 10 16 4" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M60 98 l-30 -6 M60 106 l-30 6 M140 98 l30 -6 M140 106 l30 6" stroke="#222" stroke-width="2" stroke-linecap="round"/><path d="M58 70 q6 -8 12 0 M130 70 q6 -8 12 0" stroke="#d9822b" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
<div id="start"><h1>از طرف خفنترینبردهجهان</h1><button id="go">سیکیم استارت</button></div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),C=cv.getContext('2d'),cf=$('cf'),F=cf.getContext('2d');
let W,H,D;
const LOW=matchMedia('(pointer:coarse)').matches||innerWidth<700;
function rs(){D=Math.min(devicePixelRatio||1,LOW?1.5:2);W=innerWidth;H=innerHeight;for(const c of[cv,cf]){c.width=W*D;c.height=H*D}}
addEventListener('resize',rs);rs();
const R=(a,b)=>a+Math.random()*(b-a),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)};

/* ---------- AUDIO ---------- */
let A,M,t0=0,nb=0,scI=-1,dr,nbuf;
const SCN=[{s:0,p:1},{s:19,p:.5},{s:41,p:.5},{s:45.6,p:.25},{s:56,p:.3125}];
const SCALE=[293.66,311.13,369.99,392,440,466.16,587.33,622.25];
function osc(type,f,t,d,v,f2,out){const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out||M);o.start(t);o.stop(t+d+.05)}
function nz(t,d,v,f,q=1){const s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();s.buffer=nbuf;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(M);s.start(t);s.stop(t+d)}
const kick=(t,v=.9)=>osc('sine',130,t,.4,v,38);
function initAudio(){
 A=new(window.AudioContext||window.webkitAudioContext)();
 M=A.createGain();M.gain.value=.8;M.connect(A.destination);
 const dl=A.createDelay(1),fb=A.createGain();dl.delayTime.value=.34;fb.gain.value=.38;M.connect(dl);dl.connect(fb).connect(dl);dl.connect(A.destination);
 nbuf=A.createBuffer(1,A.sampleRate,A.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 dr=A.createGain();dr.gain.value=0;dr.gain.linearRampToValueAtTime(.16,A.currentTime+3);
 const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;dr.connect(lp).connect(M);
 [73.42,73.9,110.2,146.8,147.6].forEach((f,i)=>{const o=A.createOscillator();o.type=i%2?'sawtooth':'triangle';o.frequency.value=f;o.connect(dr);o.start()});
 t0=A.currentTime+.3;
}
function step(sc,k,t){
 const T=t-t0;
 if(sc==0){kick(t,.95);kick(t+.26,.5);if(k%4==3)osc('triangle',SCALE[(k>>2)%4]/2,t,1.6,.1)}
 else if(sc==1){
  const up=T<27,n=SCALE[(k*3)%8]*(up?1+Math.min(k,16)*.02:1);
  osc('triangle',n,t,.3,.16);osc('triangle',SCALE[(k*3+2)%8]*2,t+.25,.25,.1);
  if(!up){kick(t);nz(t+.25,.06,.25,9000,2);if(k%2)osc('sawtooth',73.4,t,.4,.12)}else if(k%2==0)kick(t,.5)}
 else if(sc==2){osc('triangle',SCALE[(k*5)%8]*2,t,.2,.13);kick(t,.7);nz(t,.1,.2,3000+Math.random()*4000,3)}
 else{const mel=[0,2,4,2,5,4,2,0],bass=[0,0,3,0];
  if(k%2==0)osc('square',SCALE[bass[(k>>1)%4]]/4,t,.22,.12);
  osc('square',SCALE[mel[k%8]]*(sc==4?1:2),t,.13,.07);
  if(k%4==0)kick(t,.6);if(k%4==2)nz(t,.07,.25,6000,1)}
}
function sched(){
 if(!A)return;const now=A.currentTime;
 while(nb<now+.2){const T=nb-t0;let i=0;for(let j=0;j<SCN.length;j++)if(T>=SCN[j].s-.001)i=j;
  if(i!=scI){scI=i;nb=t0+SCN[i].s;if(nb<now)nb=now;kI=0}
  step(i,kI++,nb);nb+=SCN[i].p}
}
let kI=0;setInterval(sched,40);
const slash=()=>{const t=A.currentTime;nz(t,.35,.9,5200,.7);osc('sawtooth',900,t,.25,.3,80);kick(t,1.2);osc('sine',50,t,1.8,.8,30)};
const drop=()=>{const t=A.currentTime;nz(t,1.2,.5,800,.5);kick(t,1.3);[0,4,7,12].forEach((s,i)=>osc('sawtooth',293.66*2**(s/12),t,1.4,.1))};
const scratch=()=>{const t=A.currentTime;dr.gain.cancelScheduledValues(t);dr.gain.setTargetAtTime(0,t,.05);for(let i=0;i<4;i++)nz(t+i*.07,.1,.6,1500+i*900,4);osc('sawtooth',800,t,.3,.2,120)};
const boing=()=>{const t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(620,t+.1);o.frequency.exponentialRampToValueAtTime(220,t+.35);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g).connect(M);o.start(t);o.stop(t+.42)};
const chime=()=>{const t=A.currentTime;[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>osc('triangle',f,t+i*.09,.9,.2))};
const EV=[[12,slash],[27,drop],[45.6,scratch]];

/* ---------- SUBTITLES ---------- */
const SUBS=[[1.5,11.5,'روزی روزگاری، در سرزمین پارس، دختری زیباتر از ماه زندگی می‌کرد...'],[13,18.8,'که از شدت زیبایی‌اش، پدرش او را کشت...'],[20,26.5,'ولی سرنوشت او را رها نکرد و به او شانسی دوباره داد!'],[27.4,32.6,'او در ۱۹ شهریور دوباره متولد شد، با نام جدید: مبینا...'],[33.2,40.6,'با همان زیبایی سابق، اما این بار یک فرق بزرگ داشت: او حق انتخاب داشت و نمی‌خواست به سادگی کشته شود!']];
const sub=$('sub');

/* ---------- SCENE HELPERS ---------- */
let T=0,shake=0,flash=0,flashC='#fff',started=false,over=false;
const motes=Array.from({length:LOW?25:60},()=>({x:Math.random(),y:Math.random(),v:R(.01,.04),s:R(.6,2)}));
const stars=Array.from({length:LOW?90:170},()=>({a:R(0,6.28),r:R(.02,1),v:R(.4,1.6)}));
function beat(){const i=SCN.findLast?SCN.findLast(s=>T>=s.s):SCN[0];const sc=i||SCN[0];const p=sc.p*(sc.s>=45.6?2:1);return Math.exp(-(((T-sc.s)/p)%1)*5)}
function ridge(base,amp,sp,col,seed){C.fillStyle=col;C.beginPath();C.moveTo(0,H);for(let x=0;x<=W+10;x+=10){const u=x+T*sp;C.lineTo(x,base-amp*(Math.sin(u*.004+seed)*.5+Math.sin(u*.011+seed*2)*.3+Math.sin(u*.027+seed*3)*.12+.6))}C.lineTo(W,H);C.fill()}
function domes(base,sc,sp,col){C.fillStyle=col;const g=260*sc,n=Math.ceil(W/g)+2;for(let i=0;i<n;i++){const x=((i*g-T*sp)%(n*g))-g/2,h=(40+((i*37)%5)*14)*sc,w=(70+((i*53)%4)*14)*sc;C.fillRect(x-w/2,base-h,w,h+400);C.beginPath();C.arc(x,base-h,w/2,Math.PI,0);C.fill();C.fillRect(x-2*sc,base-h-w/2-34*sc,4*sc,34*sc);C.fillRect(x+w/2+12*sc,base-h*1.8,9*sc,h*1.8+400);C.beginPath();C.arc(x+w/2+16.5*sc,base-h*1.8,6*sc,Math.PI,0);C.fill()}}
function fog(a,col='150,140,190'){for(let i=0;i<(LOW?3:6);i++){const x=((i*W/4+T*14*(1+i%2))%(W*1.6))-W*.3,y=H*(.55+.08*Math.sin(T*.3+i)),r=W*.38;const g=C.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);C.fillStyle=g;C.fillRect(x-r,y-r,2*r,2*r)}}
function girl(x,y,s,mod,glow){C.save();C.translate(x,y);C.scale(s,s);const sw=Math.sin(T*1.5)*4,col=mod?'#0a0f1c':'#020204';
 const g=C.createRadialGradient(0,-60,5,0,-60,110);g.addColorStop(0,glow);g.addColorStop(1,'transparent');C.fillStyle=g;C.fillRect(-120,-180,240,240);
 C.fillStyle=col;C.beginPath();
 if(mod){C.moveTo(-9,-88);C.lineTo(9,-88);C.lineTo(14,-35);C.lineTo(11,0);C.lineTo(2,0);C.lineTo(0,-30);C.lineTo(-2,0);C.lineTo(-11,0);C.lineTo(-14,-35)}else{C.moveTo(-7,-88);C.lineTo(7,-88);C.lineTo(28+sw,0);C.lineTo(-28+sw,0)}C.closePath();C.fill();
 C.beginPath();C.arc(0,-100,10.5,0,6.3);C.fill();
 C.beginPath();C.moveTo(-8,-106);C.quadraticCurveTo(-34+sw*2,-92,-24+sw*3,-52);C.quadraticCurveTo(-12,-86,9,-106);C.fill();
 if(mod){C.strokeStyle=glow;C.lineWidth=3;C.shadowColor=glow;C.shadowBlur=14;C.beginPath();C.moveTo(-5,-101);C.lineTo(-2,-101);C.moveTo(2,-101);C.lineTo(5,-101);C.stroke();C.shadowBlur=0}
 C.restore()}
function father(x,y,s,arm){C.save();C.translate(x,y);C.scale(s,s);C.fillStyle='#000';C.beginPath();C.moveTo(-14,-170);C.lineTo(14,-170);C.lineTo(40,0);C.lineTo(-40,0);C.fill();C.beginPath();C.arc(0,-188,17,0,6.3);C.fill();
 C.beginPath();C.moveTo(-26,-196);C.lineTo(0,-224);C.lineTo(26,-196);C.fill();
 C.save();C.translate(-12,-160);C.rotate(-1.2-arm*1.1);C.fillRect(-7,0,14,-70);C.fillRect(-2,-70,4,-120);C.fillRect(-12,-72,24,5);C.restore();
 C.fillStyle='#ff2a3a';C.fillRect(-9,-192,6,3);C.fillRect(3,-192,6,3);C.restore()}
function tiny(x,y,s,i,col){const b=Math.abs(Math.sin(T*3.2+i))*1;C.save();C.translate(x,y);C.scale(s,s);C.fillStyle=col;C.beginPath();C.ellipse(0,-6,16,7,0,0,6.3);C.fill();C.save();C.translate(6,-10);C.rotate(-.2-b*1.0);C.beginPath();C.roundRect(-9,-30,18,32,8);C.fill();C.beginPath();C.arc(0,-38,10,0,6.3);C.fill();C.restore();C.restore()}

/* ---------- SCENES ---------- */
function s1(){
 const k=sm(T/2),mx=W*.5,my=H*.3,mr=Math.min(W,H)*.2;
 let g=C.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0618');g.addColorStop(.6,'#2a1635');g.addColorStop(1,'#120a1c');C.fillStyle=g;C.fillRect(0,0,W,H);
 g=C.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);g.addColorStop(0,'rgba(255,230,180,.5)');g.addColorStop(1,'rgba(255,230,180,0)');C.fillStyle=g;C.fillRect(0,0,W,H);
 C.fillStyle='#f6e8c8';C.shadowColor='#ffe9b0';C.shadowBlur=LOW?20:60;C.beginPath();C.arc(mx,my,mr,0,6.3);C.fill();C.shadowBlur=0;
 ridge(H*.62,H*.22,4,'#1a0f26',1);fog(.07);domes(H*.78,Math.min(1,W/700)+.3,16,'#0c0614');ridge(H*.86,H*.12,10,'#07040c',5);fog(.09);
 C.fillStyle='#07040c';C.fillRect(0,H*.86,W,H);
 const gs=Math.min(H/380,1.6),gx=W*.4,gy=H*.9;
 if(T<12.15)girl(gx,gy,gs,false,'rgba(255,235,190,.55)');
 if(T>8){const u=sm((T-8)/2.2),ar=sm((T-10.2)/1.6);father(W*1.1-(W*.38)*u,gy,gs*1.05,ar)}
 C.fillStyle='#e8c88a';motes.forEach(m=>{C.globalAlpha=.5;C.fillRect(((m.x+T*m.v*.3)%1)*W,((m.y-T*m.v*.2+1)%1)*H,m.s,m.s)});C.globalAlpha=1;
 const v=C.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.75)');C.fillStyle=v;C.fillRect(0,0,W,H);
 if(T>=12.15&&T<12.5){const u=(T-12.15)/.35;C.strokeStyle='#fff';C.lineWidth=6*(1-u);C.shadowColor='#f23';C.shadowBlur=30;C.beginPath();C.moveTo(W*.8,gy-gs*300);C.lineTo(W*.2,gy);C.stroke();C.shadowBlur=0}
 C.fillStyle='#000';C.globalAlpha=T<2?1-k:(T>12.4?sm((T-12.4)/.3):0);C.fillRect(0,0,W,H);C.globalAlpha=1;
}
function s2(){
 const u=(T-19)/22,hue=T<27?350-(T-19)*10:(T<33?190-(T-27)*0:190+(T-33)*-18),cx=W/2,cy=H*.42,R0=Math.hypot(W,H)*.6;
 const hh=T<27?(350-sm((T-19)/8)*170):(T<35?180-sm((T-27)/8)*130:50);
 C.fillStyle=`hsl(${hh},60%,6%)`;C.fillRect(0,0,W,H);
 const sp=T<27?(1+(T-19)*.6):.8;
 stars.forEach(s=>{const a=s.a+T*s.v*sp*(1.3-s.r)+s.r*3,r=((s.r+T*.05*sp)%1)*R0,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.8;C.strokeStyle=`hsla(${hh+s.r*50},90%,${60+s.r*30}%,${.3+s.r*.5})`;C.lineWidth=1+s.r*2;C.beginPath();C.moveTo(x,y);C.lineTo(cx+Math.cos(a-.06)*(r*.97),cy+Math.sin(a-.06)*r*.97*.8);C.stroke()});
 const cr=Math.min(W,H)*.26;C.save();C.translate(cx,cy);C.strokeStyle=`hsl(${hh+30},90%,65%)`;C.lineWidth=3;C.shadowColor=C.strokeStyle;C.shadowBlur=20;C.beginPath();C.arc(0,0,cr,0,6.3);C.stroke();
 for(let i=0;i<12;i++){C.rotate(.5236);C.beginPath();C.moveTo(cr*.9,0);C.lineTo(cr,0);C.stroke()}
 const fast=T<27?T*(6+(T-19)):0;C.rotate(T<27?fast:0);C.lineWidth=5;C.beginPath();C.moveTo(0,0);C.lineTo(cr*.8,0);C.stroke();C.rotate(T<27?-fast*.9:0);C.lineWidth=7;C.beginPath();C.moveTo(0,0);C.lineTo(cr*.55,0);C.stroke();C.restore();C.shadowBlur=0;
 if(T>=27){const q=sm((T-27)/1.2);const gl=`rgba(120,240,255,${.7})`;C.save();C.globalAlpha=q;for(let i=0;i<14;i++){const a=i*.4488+T*.4;C.strokeStyle='rgba(255,215,120,.35)';C.lineWidth=14;C.beginPath();C.moveTo(cx,cy);C.lineTo(cx+Math.cos(a)*R0,cy+Math.sin(a)*R0);C.stroke()}C.restore();
  C.globalAlpha=q;girl(cx,H*.8,Math.min(H/340,1.8),true,gl);C.globalAlpha=1;
  const dt=sm((T-27.2)/.5)*(1-sm((T-33)/.6));if(dt>0){C.save();C.globalAlpha=dt;C.fillStyle='#ffd978';C.shadowColor='#ffb030';C.shadowBlur=30;C.font=`900 ${Math.min(W*.14,110)*(1+beat()*.08)}px Vazirmatn`;C.textAlign='center';C.fillText('۱۹ شهریور',cx,H*.2);C.restore()}}
 const f=sm((T-19)/1.2);if(f<1){C.fillStyle=`rgba(0,0,0,${1-f})`;C.fillRect(0,0,W,H)}
}
function s3(){
 const bg=T<45.6;C.fillStyle=bg?'#060a14':'#0a1226';C.fillRect(0,0,W,H);
