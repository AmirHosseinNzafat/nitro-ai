<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--panel2:#262626;--line:#424242;--text:#ececec;--muted:#a1a1a1;--green:#10a37f;--hover:#2a2a2a;--blue:#6aa9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer;background:transparent}button:hover{background:var(--hover)}a{color:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:260px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:12px;transition:.2s;z-index:5}.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#18c69a,#087c65);display:grid;place-items:center;color:white;font-size:19px;font-weight:900}.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#bbb;font-size:18px}.navbtn{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;text-align:right;width:100%;font-size:13px;margin:2px 0}.navbtn .ico{font-size:17px;width:20px;text-align:center}.navbtn.active{background:#2a2a2a}.side-label{font-size:11px;color:#858585;padding:18px 10px 7px}.history{overflow:auto;flex:1}.history-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:9px;font-size:12px;color:#d2d2d2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item:hover,.history-item.active{background:#292929}.profile{border-top:1px solid #303030;padding-top:12px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#6654a3;display:grid;place-items:center;font-size:14px;font-weight:800}.profile-name{font-size:12px;font-weight:700}.profile-plan{font-size:10px;color:var(--muted)}.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}.top-left,.top-right{display:flex;align-items:center;gap:8px}.model-select{font-size:16px;font-weight:800;padding:8px 11px;border-radius:10px}.model-select span{color:#aaa;font-size:11px;margin-right:6px}.upgrade{border:1px solid #555;border-radius:20px;padding:8px 13px;font-size:11px}.content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center}.welcome{width:min(790px,calc(100% - 32px));margin:auto auto 0;padding:20px 0 22px;text-align:center}.welcome h1{font-size:29px;font-weight:600;margin:0 0 25px;letter-spacing:-.5px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 auto 18px;max-width:620px}.quick{transition:transform .16s ease,border-color .16s ease,background .16s ease}.quick:active,.navbtn:active,.tool-pill:active{transform:scale(.97)}.quick:hover{border-color:#666;background:#303030}.quick{border:1px solid #424242;border-radius:14px;text-align:right;padding:13px 15px;min-height:72px}.quick b{font-size:13px;display:block}.quick small{font-size:11px;color:var(--muted)}.composer-wrap{width:min(790px,calc(100% - 32px));padding:10px 0 24px;flex:none}.composer{background:#303030;border:1px solid #484848;border-radius:25px;padding:12px 14px 9px;box-shadow:0 8px 35px #0002}.composer textarea{width:100%;resize:none;max-height:180px;min-height:36px;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;padding:7px 5px}.composer textarea::placeholder{color:#aaa}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:8px}.tool-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.tool-pill{font-size:11px;color:#ccc;padding:7px 10px;border-radius:18px;display:flex;gap:6px;align-items:center}.tool-pill.on{background:#164638;color:#8ce5c4}.send{width:34px;height:34px;border-radius:50%;background:#eee;color:#222;font-size:18px;font-weight:900}.send:disabled{opacity:.4;cursor:default}.footnote{text-align:center;color:#858585;font-size:10px;margin-top:9px}.messages{width:min(820px,calc(100% - 48px));margin:26px max(28px,calc((100% - 1120px)/2)) 8px auto;display:flex;flex-direction:column;gap:24px;align-self:flex-end}.composer-wrap{width:min(850px,calc(100% - 56px));margin-right:max(28px,calc((100% - 1120px)/2));margin-left:auto}.welcome{width:min(850px,calc(100% - 56px));margin:auto max(28px,calc((100% - 1120px)/2)) 0 auto}.msg.user{justify-content:flex-start}.msg-body img.generated-image{display:block;max-width:min(100%,520px);height:auto;border-radius:14px;border:1px solid #555;margin:10px 0}.image-result{background:#292929;border:1px solid #444;border-radius:14px;padding:10px;margin-top:10px}.image-result img{display:block;width:min(100%,520px);border-radius:10px}.image-result a{display:inline-block;margin-top:8px;color:#8bdcc4;font-size:12px}.msg{display:flex;gap:12px;align-items:flex-start}.msg.user{justify-content:flex-start}.msg-avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#3d3d3d;font-size:13px}.msg.assistant .msg-avatar{background:linear-gradient(145deg,#18c69a,#087c65)}.msg-body{min-width:0;max-width:calc(100% - 42px);font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .msg-body{background:#303030;border-radius:18px;padding:10px 15px}.msg-actions{display:flex;gap:6px;margin-top:7px}.msg-actions button{color:#999;padding:4px 7px;border-radius:7px;font-size:11px}.source{border:1px solid #4b4b4b;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:11px;display:block;text-decoration:none;background:#292929}.source small{display:block;color:#aaa}.typing{color:#aaa;font-size:12px}.page{width:min(900px,calc(100% - 36px));margin:38px auto;}.page h1{font-size:25px;margin:0 0 8px}.page-sub{color:#aaa;font-size:13px;margin-bottom:25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid #414141;background:#292929;border-radius:15px;padding:16px;min-height:120px}.card .card-icon{font-size:23px}.card h3{font-size:14px;margin:9px 0 4px}.card p{font-size:11px;color:#aaa;line-height:1.8;margin:0}.card button{margin-top:12px;border:1px solid #555;border-radius:9px;padding:7px 11px;font-size:11px}.modal-bg{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:#242424;border:1px solid #555;border-radius:18px;padding:20px;max-height:85vh;overflow:auto}.modal h2{font-size:17px;margin:0 0 12px}.modal p{font-size:12px;color:#aaa;line-height:1.9}.modal input,.modal textarea,.modal select{width:100%;background:#333;border:1px solid #555;border-radius:9px;padding:10px;color:white;margin:6px 0}.modal input{width:100%;background:#333;border:1px solid #555;border-radius:9px;padding:10px;color:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.modal-actions button{padding:8px 14px;border-radius:9px;background:#3a3a3a;font-size:12px}.modal-actions .primary{background:var(--green);color:white}.think-state{font-size:10px;color:#9de5cb;padding:4px 8px;border:1px solid #315e50;border-radius:20px}.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.image-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;border:1px solid #555;padding:9px 15px;border-radius:12px;font-size:11px;z-index:30}
@media(max-width:760px){.messages,.composer-wrap,.welcome{width:calc(100% - 20px);margin:20px auto 10px}.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);width:275px;box-shadow:10px 0 50px #0008}.sidebar.open{transform:translateX(0)}.topbar{padding:0 10px}.welcome h1{font-size:23px}.quick-grid{grid-template-columns:1fr}.quick{min-height:58px}.composer-wrap{width:calc(100% - 20px);padding-bottom:14px}.messages{width:calc(100% - 24px)}.page{margin:25px auto}.upgrade{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-top"><div class="brand"><div class="logo">N</div><span>NITRO AI</span></div><button class="iconbtn" id="collapseBtn" title="بستن منو">☰</button></div>
 <button class="navbtn active" data-page="chat" id="newChat"><span class="ico">＋</span> چت جدید</button>
 <button class="navbtn" data-page="search"><span class="ico">⌕</span> جست‌وجو</button>
 <button class="navbtn" data-page="explore"><span class="ico">▦</span> اکسپلور</button>
 <button class="navbtn" data-page="library"><span class="ico">▧</span> کتابخانه تصاویر</button>
 <button class="navbtn" data-page="projects"><span class="ico">▣</span> پروژه‌ها</button>
 <button class="navbtn" id="memoryBtn"><span class="ico">✧</span> حافظه نیترو</button>
 <div class="side-label">اخیر</div><div class="history" id="history"></div>
 <div class="profile"><div class="avatar">N</div><div style="flex:1"><div class="profile-name">کاربر نیترو</div><div class="profile-plan" id="planLabel">پلن Free</div></div><button class="iconbtn" id="profileBtn">•••</button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="iconbtn" id="menuBtn">☰</button><button class="model-select" id="modelBtn">NITRO 1 <span>⌄</span></button><span class="think-state" id="offlineStatus">حافظه محلی فعال</span></div><div class="top-right"><button class="upgrade" id="planBtn">ارتقا به Plus ↗</button><button class="iconbtn" id="settingsBtn" title="تنظیمات">⚙</button></div></header>
 <section class="content" id="content">
  <div class="welcome" id="welcome"><h1>امروز چطور می‌تونم کمکت کنم؟</h1><div class="quick-grid">
   <button class="quick" data-prompt="برای پروژه‌ام یک برنامه حرفه‌ای طراحی کن"><b>✦ ایده‌پردازی و برنامه‌ریزی</b><small>ایده‌ها را به برنامه تبدیل کن</small></button>
   <button class="quick" data-prompt="این کد را بررسی و اشکال‌زدایی کن"><b>⌘ برنامه‌نویسی</b><small>کدنویسی و رفع اشکال</small></button>
   <button class="quick" data-prompt="یک موضوع را با جست‌وجوی وب بررسی کن"><b>⌕ تحقیق در وب</b><small>اطلاعات تازه همراه منابع</small></button>
   <button class="quick" data-prompt="یک داستان جذاب و خلاقانه بنویس"><b>✎ نوشتن و خلاقیت</b><small>متن، داستان و سناریو</small></button>
  </div></div>
  <div class="messages hidden" id="messages"></div>
  <div class="page hidden" id="page"></div>
 </section>
 <footer class="composer-wrap" id="composerWrap">
  <div class="composer"><textarea id="prompt" rows="1" placeholder="پیامی برای NITRO AI بنویس..."></textarea>
   <div class="composer-tools"><div class="tool-group">
    <button class="iconbtn" id="attachBtn" title="افزودن فایل">＋</button><input type="file" id="fileInput" hidden multiple>
    <button class="tool-pill" id="searchToggle">⌕ جست‌وجوی وب</button>
    <button class="tool-pill" id="thinkToggle">◉ فکرکردن</button>
    
   </div><button class="send" id="sendBtn" disabled>↑</button></div>
  </div><div class="footnote">NITRO AI ممکن است اشتباه کند. اطلاعات مهم را بررسی کن.</div>
 </footer>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);
const state={chats:[],active:null,search:false,think:false,thinkMode:'medium',model:'NITRO Chat',imageModel:'NITRO Image',plan:'Free',page:'chat',images:[],files:[],projects:[]};
const saved=localStorage.getItem('nitro-chat-v1');if(saved){try{Object.assign(state,JSON.parse(saved))}catch{}}if(!['NITRO Chat','NITRO Image','NITRO Model'].includes(state.model))state.model='NITRO Chat';if(!state.imageModel)state.imageModel='NITRO Image';
function persist(){localStorage.setItem('nitro-chat-v1',JSON.stringify({...state,files:[]}));}
const MEMORY_KEY='nitro-learning-v1';
function readMemory(){try{return JSON.parse(localStorage.getItem(MEMORY_KEY)||'{"facts":[],"messageLog":[]}')}catch{return {facts:[],messageLog:[]}}}
function writeMemory(m){localStorage.setItem(MEMORY_KEY,JSON.stringify(m));}
function learnFromMessage(text){const m=readMemory();m.messageLog.push({text:String(text).slice(0,1200),at:Date.now()});if(m.messageLog.length>250)m.messageLog=m.messageLog.slice(-250);const match=String(text).match(/^(?:یاد بگیر(?: که)?|به خاطر بسپار(?: که)?|این را یاد بگیر(?: که)?)[：:\s]+(.+)$/i);if(match){const fact=match[1].trim();if(fact&&!m.facts.some(x=>norm(x.text)===norm(fact)))m.facts.push({text:fact,createdAt:new Date().toISOString(),source:'user'});writeMemory(m);return fact}writeMemory(m);return null}
function relevantMemory(q){const m=readMemory(),n=norm(q);return m.facts.filter(x=>{const words=norm(x.text).split(' ').filter(w=>w.length>2);return words.some(w=>n.includes(w))}).slice(0,4)}
function learnSearchResult(q,title,extract,url,lang){const m=readMemory();m.searches=m.searches||[];const clean=String(extract||'').slice(0,1800);const item={query:String(q).slice(0,200),title:String(title).slice(0,240),summary:clean,url,lang,learnedAt:new Date().toISOString()};const key=norm(item.title);m.searches=m.searches.filter(x=>norm(x.title)!==key);m.searches.unshift(item);m.searches=m.searches.slice(0,80);writeMemory(m)}
function recalledSearch(q){const n=norm(q),terms=n.split(' ').filter(w=>w.length>2);const items=readMemory().searches||[];return items.map(x=>({x,score:terms.reduce((a,w)=>a+((norm(x.query+' '+x.title+' '+x.summary).includes(w))?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0]?.x||null}
function exportMemory(){const blob=new Blob([JSON.stringify(readMemory(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nitro-memory.json';a.click();URL.revokeObjectURL(a.href);}
function openMemory(){const m=readMemory();const facts=m.facts.map((x,i)=>'<div class="source"><b>'+escapeHtml(x.text)+'</b><small>دانسته کاربر · '+new Date(x.createdAt).toLocaleString('fa-IR')+'</small><button data-del-fact="'+i+'">حذف</button></div>').join('')||'<p>هنوز دانسته‌ای به حافظه اضافه نشده. بنویس: «یاد بگیر که SCP-999 موجودی دوستانه است».</p>';const searches=(m.searches||[]).map(x=>'<div class="source"><b>'+escapeHtml(x.title)+'</b><small>یادداشت جست‌وجو · '+escapeHtml(x.query)+' · '+new Date(x.learnedAt).toLocaleString('fa-IR')+'</small><a href="'+escapeHtml(x.url)+'" target="_blank" rel="noopener">مشاهده منبع</a><p>'+escapeHtml((x.summary||'').slice(0,260))+'</p></div>').join('')||'<p>هنوز جست‌وجویی ذخیره نشده است.</p>';openModal('حافظه و یادگیری NITRO AI','<p>دانسته‌های صریح و خلاصه جست‌وجوها در همین مرورگر ذخیره می‌شوند. خلاصه‌ها همراه لینک منبع و تاریخ نگهداری می‌شوند؛ ذخیره شدن به معنی تأیید قطعی محتوا نیست.</p><h3>دانسته‌های آموزش‌داده‌شده</h3><div>'+facts+'</div><h3>یادداشت‌های جست‌وجو</h3><div>'+searches+'</div><div class="modal-actions"><button id="exportMemory">خروجی JSON</button><button id="importMemory">ورود JSON</button><input id="memoryFile" type="file" accept="application/json" hidden></div>');$('exportMemory').onclick=exportMemory;$('importMemory').onclick=()=>$('memoryFile').click();$('memoryFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.facts))throw Error();writeMemory(obj);closeModal();toast('حافظه وارد شد')}catch{toast('فایل JSON معتبر نیست')}};$('modalRoot').querySelectorAll('[data-del-fact]').forEach(b=>b.onclick=()=>{const x=readMemory();x.facts.splice(+b.dataset.delFact,1);writeMemory(x);closeModal();openMemory()})}
let offline={fa:[],en:[],scp:[],creepypasta:[]};
async function loadOffline(){try{const [fa,en,lore]=await Promise.all([fetch('./data/offline/dictionary.fa-en.json').then(x=>x.json()),fetch('./data/offline/dictionary.en-fa.json').then(x=>x.json()),fetch('./data/offline/scp-lore.fa-en.json').then(x=>x.json())]);offline={fa:fa.entries||[],en:en.entries||[],scp:lore.scp||[],creepypasta:lore.creepypasta||[]};toast('دانش آفلاین نیترو بارگذاری شد · '+(offline.fa.length+offline.en.length)+' مدخل واژه‌نامه')}catch(e){console.warn('Offline pack unavailable',e)}}
loadOffline();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
function norm(s){return String(s||'').toLocaleLowerCase().replace(/[\u200c\u200f]/g,' ').replace(/[ًٌٍَُِّْ]/g,'').replace(/[.,!?؟،؛:()[\]{}"']/g,' ').replace(/\s+/g,' ').trim()}
function dictionaryLookup(q){const n=norm(q);if(!n)return null;const fa=offline.fa.find(x=>norm(x.word)===n);if(fa)return {kind:'exact',text:fa.word+' = '+fa.translation,direction:'فارسی به انگلیسی'};const en=offline.en.find(x=>norm(x.word)===n);if(en)return {kind:'exact',text:en.word+' = '+en.translation,direction:'English to Persian'};const words=n.split(' ').filter(Boolean);if(words.length<2)return null;const found=words.map(w=>{const a=offline.fa.find(x=>norm(x.word)===w);const b=offline.en.find(x=>norm(x.word)===w);return a?{word:w,translation:a.translation}:b?{word:w,translation:b.translation}:null}).filter(Boolean);return found.length>=2?{kind:'words',text:found.map(x=>x.word+' → '+x.translation).join('\n'),direction:'ترجمه کلمه‌به‌کلمه'}:null}
function loreLookup(q){const n=norm(q);const hit=offline.scp.find(x=>n.includes(norm(x.id))||n.includes(norm(x.name_fa))||n.includes(norm(x.name_en)))||offline.creepypasta.find(x=>n.includes(norm(x.name)));return hit||null;}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function current(){return state.chats.find(c=>c.id===state.active)}
function newChat(){const c={id:Date.now().toString()+Math.random().toString(36).slice(2,6),title:'چت جدید',messages:[],time:Date.now()};state.chats.unshift(c);state.active=c.id;state.page='chat';$('prompt').value='';$('sendBtn').disabled=true;render();persist();$('prompt').focus()}
function renderHistory(){const el=$('history');el.innerHTML='';state.chats.slice(0,40).forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===state.active?' active':'');b.textContent=c.title;b.onclick=()=>{state.active=c.id;state.page='chat';render()};el.appendChild(b)})}
function render(){renderHistory();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('modelBtn').innerHTML=state.model+' <span>⌄</span>';$('planLabel').textContent='پلن '+state.plan;
